{% extends "app/layout.html" %}

{% block content %}
<div class="container">
    <h2>{{ title }}</h2>

    <div class="mb-4">
        <a href="{% url 'admin_categories' %}" class="btn btn-outline-secondary">← Назад к категориям</a>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Название категории *</label>
                            {{ form.name }}
                            {% if form.name.errors %}
                            <div class="text-danger">{{ form.name.errors }}</div>
                            {% endif %}
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Описание</label>
                            {{ form.description }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Родительская категория</label>
                            {{ form.parent }}
                            <div class="form-text">Оставьте пустым, если это основная категория</div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg">
                                {% if category %}Обновить{% else %}Добавить{% endif %} категорию
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
