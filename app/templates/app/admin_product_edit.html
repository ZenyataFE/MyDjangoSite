{% extends "app/layout.html" %}

{% block content %}
<div class="container">
    <h2>{{ title }}</h2>

    <div class="mb-4">
        <a href="{% url 'admin_products' %}" class="btn btn-outline-secondary">← Назад к товарам</a>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Название товара</label>
                            {{ form.name }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Описание</label>
                            {{ form.description }}
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Цена</label>
                                    {{ form.price }}
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">Категория</label>
                                    {{ form.category }}
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Изображение</label>
                            {{ form.image }}
                            {% if product and product.image %}
                            <div class="mt-2">
                                <small>Текущее изображение:</small><br>
                                <img src="{{ product.image.url }}" alt="{{ product.name }}" style="max-width: 200px; max-height: 150px;">
                            </div>
                            {% endif %}
                        </div>

                        <div class="mb-3 form-check">
                            {{ form.in_stock }}
                            <label class="form-check-label">В наличии</label>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg">
                                {% if product %}Обновить{% else %}Добавить{% endif %} товар
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
